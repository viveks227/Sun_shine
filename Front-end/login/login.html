<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="login.css">
    <script src="login.js"></script>
</head>
<body>

    <!-- LOGIN CONTAINER -->
    <div id="loginContainer" class="form-card">
        <form action="login.php" method="post">
            <table>
                <tr>
                    <th colspan="2">Welcome Back!</th>
                </tr>
                <tr>
                    <td colspan="2">
                        <label>Username</label><br/>
                        <input type="text" name="username" id="username" placeholder="Username" required>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <label>Password</label><br/>
                        <input type="password" name="password" id="password" placeholder="Password" required>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" id="forget">
                        <a href="#" onclick="showForget()">Forget Password?</a>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <button type="submit">Log in</button>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <div class="divider">
                            <hr><span>OR</span><hr>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <button type="button" id="sinup">
                            <i class="fa fa-google"></i> Sign in With Google
                        </button>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <p>Don't have an account? <a href="#" onclick="showRegister()">Register here</a></p>
                    </td>
                </tr>
            </table>
        </form>
    </div>

    <!-- REGISTER CONTAINER -->
    <div id="registerContainer" class="form-card">
        <form action="" method="post">
            <table>
                <tr>
                    <th colspan="2">Create Account</th>
                </tr>
                <tr>
                    <td>Name :</td>
                    <td><input type="text" placeholder="full name" required/></td>
                </tr>
                <tr>
                    <td>Mobile Number :</td>
                    <td><input type="tel" placeholder="number" required/></td>
                </tr>
                <tr>
                    <td>Email Id :</td>
                    <td><input type="email" placeholder="mail id" required/></td>
                </tr>
                <tr>
                    <td>Password :</td>
                    <td><input type="password" placeholder="enter password" required/></td>
                </tr>
                <tr>
                    <td>Confirm Password :</td>
                    <td><input type="password" placeholder="confirm password" required/></td>
                </tr>
                <tr>
                   <td colspan="2">
                       <button type="submit">Register</button>
                   </td> 
                </tr>
                <tr>
                    <td colspan="2">
                        <p>Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
                    </td>
                </tr>
            </table>
        </form>
    </div>

    <!-- FORGET PASSWORD CONTAINER -->
    <div id="forgetContainer" class="form-card">
        <form action="" method="post">
            <table>
                <tr>
                    <th colspan="2">Forget Password</th>
                </tr>
                <tr>
                    <td>Email ID :</td>
                    <td><input type="email" placeholder="mail id" required/></td>
                </tr>
                <tr>
                    <td>Mobile no. :</td>
                    <td><input type="tel" placeholder="number" required/></td>
                </tr>
                <tr>
                    <td>Verify OTP :</td>
                    <td><input type="tel" placeholder="OTP" required/></td>
                </tr>
                <tr>
                    <td>New Password :</td>
                    <td><input type="password" placeholder="new password" required/></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <button type="submit">Submit</button>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <p>Return to <a href="#" onclick="showLogin()">Login</a></p>
                    </td>
                </tr>
            </table>
        </form>
    </div>

</body>
</html>
