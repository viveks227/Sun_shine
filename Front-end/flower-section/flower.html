<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="flower.css">
    <script src="flower.js"></script>
</head>
<body>
    <h2>Your Flowers</h2>
    <p>Click on the buttons to filter a catorgry</p>

    <div class="filterButton">
        <button class="btn" onclick="filterSelection('all')"> Show all</button>
        <button class="btn" onclick="filterSelection('sunflower')"> Sunflower</button>
        <button class="btn" onclick="filterSelection('rose')"> Rose</button>
        <button class="btn" onclick="filterSelection('lily')"> Lily</button>
        <button class="btn" onclick="filterSelection('tulip')"> Tulip</button>
        <button class="btn" onclick="filterSelection('daisy')"> Daisy</button>
        <button class="btn" onclick="filterSelection('lotus')"> Lotus</button>
        <button class="btn" onclick="filterSelection('orchid')"> Orchid</button>
        <button class="btn" onclick="filterSelection('hibiscus')"> Hibiscus</button>
        <button class="btn" onclick="filterSelection('jasmine')"> Jasmine</button>
        
    </div>

    <div class="row">
        <div class="column sunflower">
            <div class="content">
                <img src="images/sunflower.jpg" alt="Sunflower" style="width:100%">
                <h4>Sunflower</h4>
                <p></p>
            </div>
        </div>
        <div class="coumn sunflower">
            <div class="content">
                <img src="images/sunflower.jpg" alt="Sunflower" style="width:100%">
                <h4>Sunflower</h4>
                <p></p>
            </div>
        </div>
        <div class="coulmn sunflower">
            <div class="content">
                <img src="images/sunflower.jpg" alt="Sunflower" style="width:100%">
                <h4>Sunflower</h4>
                <p></p>
            </div>
        </div>
    </div>
</body>
</html>
